<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SOC-IA — Analyse IA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #e5e7eb;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 30px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #8b93a5;
    font-size: 14px; 
    margin-bottom: 24px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }
  .card {
    background: #171a24;
    border: 1px solid #262a38;
    border-radius: 12px;
    padding: 18px;
  }
  .card .label {
    color: #8b93a5;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .card .value {
    font-size: 26px;
    font-weight: 700;
  }
  .card.blue .value { color: #4f8ef7; }
  .card.green .value { color: #22c55e; }
  .card.orange .value { color: #f59e0b; }
  .card.red .value { color: #ef4444; }

  .panels {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
  }
  .panel {
    background: #171a24;
    border: 1px solid #262a38;
    border-radius: 12px;
    padding: 18px;
  }
  .panel h2 {
    font-size: 15px;
    margin-bottom: 14px;
    color: #cbd2e0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #262a38;
  }
  th { color: #8b93a5; font-weight: 500; }
  .badge {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.Malware { background: #7f1d1d; color: #fca5a5; }
  .badge.Phishing { background: #78350f; color: #fcd34d; }
  .badge.DDoS { background: #4c1d95; color: #c4b5fd; }
  .badge.Intrusion { background: #7c2d12; color: #fdba74; }
  .badge.Exfiltration { background: #831843; color: #f9a8d4; }

  #status { color: #8b93a5; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>

  <h1>🛡️ SOC-IA — Module Analyse IA</h1>
  <div class="subtitle">Détection de menaces par intelligence artificielle — partie Hanane</div>
  <div id="status">Connexion à l'API...</div>

  <div class="cards" id="cards"></div>

  <div class="panels">
    <div class="panel">
      <h2>Score de menace dans le temps</h2>
      <canvas id="timelineChart" height="120"></canvas>
    </div>
    <div class="panel">
      <h2>Répartition par type de menace</h2>
      <canvas id="typeChart" height="120"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Dernières anomalies détectées</h2>
    <table>
      <thead>
        <tr><th>Heure</th><th>IP source</th><th>IP destination</th><th>Protocole</th><th>Score</th><th>Type</th></tr>
      </thead>
      <tbody id="anomaliesBody"></tbody>
    </table>
  </div>

<script>
const API = "http://127.0.0.1:5000/api/analyse-ia";

async function loadData() {
  try {
    const [resume, anomalies, menaces, timeline] = await Promise.all([
      fetch(`${API}/resume`).then(r => r.json()),
      fetch(`${API}/anomalies`).then(r => r.json()),
      fetch(`${API}/menaces-par-type`).then(r => r.json()),
      fetch(`${API}/timeline`).then(r => r.json()),
    ]);

    document.getElementById("status").textContent = "✅ Connecté à l'API — données à jour";

    // Cartes
    document.getElementById("cards").innerHTML = `
      <div class="card blue"><div class="label">Précision de détection</div><div class="value">${resume.precision_detection_pct}%</div></div>
      <div class="card green"><div class="label">Prédictions totales</div><div class="value">${resume.predictions_totales}</div></div>
      <div class="card orange"><div class="label">Taux faux positifs</div><div class="value">${resume.taux_faux_positifs_pct}%</div></div>
      <div class="card red"><div class="label">Anomalies détectées</div><div class="value">${resume.anomalies_detectees}</div></div>
    `;

    // Tableau anomalies (10 premières)
    const rows = anomalies.slice(0, 10).map(a => `
      <tr>
        <td>${a.timestamp}</td>
        <td>${a.src_ip}</td>
        <td>${a.dst_ip}</td>
        <td>${a.protocol}</td>
        <td>${a.threat_score}</td>
        <td><span class="badge ${a.threat_type}">${a.threat_type}</span></td>
      </tr>
    `).join("");
    document.getElementById("anomaliesBody").innerHTML = rows;

    // Graphique timeline
    new Chart(document.getElementById("timelineChart"), {
      type: "line",
      data: {
        labels: timeline.map(t => t.heure.slice(5, 16)),
        datasets: [{
          label: "Score de menace moyen",
          data: timeline.map(t => t.score_moyen),
          borderColor: "#4f8ef7",
          backgroundColor: "rgba(79,142,247,0.15)",
          fill: true,
          tension: 0.3,
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8b93a5", maxTicksLimit: 8 }, grid: { color: "#262a38" } },
          y: { ticks: { color: "#8b93a5" }, grid: { color: "#262a38" } }
        }
      }
    });

    // Graphique répartition par type
    delete menaces["Aucune"];
    new Chart(document.getElementById("typeChart"), {
      type: "doughnut",
      data: {
        labels: Object.keys(menaces),
        datasets: [{
          data: Object.values(menaces),
          backgroundColor: ["#ef4444", "#f59e0b", "#8b5cf6", "#fb923c", "#ec4899", "#22c55e"],
        }]
      },
      options: {
        plugins: { legend: { position: "bottom", labels: { color: "#cbd2e0" } } }
      }
    });

  } catch (err) {
    document.getElementById("status").textContent = "❌ Impossible de contacter l'API — vérifie que app/api.py tourne sur le port 5000";
  }
}

loadData();
</script>

</body>
</html>
